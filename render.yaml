# Render.com Blueprint — Hosted GlobeVPN Control Plane (Free Tier, No Card Required)
# Deploy via Render Dashboard -> Blueprints -> Connect Repository.
# Note: Render Free web services spin down after 15 min of inactivity (first request wakes in ~30s).

services:
  - type: web
    name: globevpn-control-plane
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_PROXY_ENABLED
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: globevpn-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: globevpn-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        value: "chrome-extension://*"

  - type: keyvalue
    name: globevpn-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: globevpn-postgres
    plan: free
    postgresMajorVersion: "16"

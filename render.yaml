# Render.com Blueprint — Hosted GlobeVPN Control Plane (Independent of User's Computer)
# Deploy via Render Dashboard -> Blueprints -> Connect Repository.
# End users never run FastAPI, PostgreSQL, Redis, or Docker locally.

services:
  - type: web
    name: globevpn-control-plane
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_PROXY_ENABLED
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: globevpn-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: globevpn-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        value: "chrome-extension://*"

  - type: keyvalue
    name: globevpn-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: globevpn-postgres
    plan: starter
    postgresMajorVersion: "16"

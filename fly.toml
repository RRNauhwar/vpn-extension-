# Fly.io Deployment Configuration — Hosted GlobeVPN Control Plane
app = "globevpn-control-plane"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  APP_ENV = "production"
  LOCAL_PROXY_ENABLED = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

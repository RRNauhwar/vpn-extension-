services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globevpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globevpn_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-globevpn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globevpn"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  local-proxy:
    build:
      context: ./infra/proxy-node
      dockerfile: Dockerfile
    environment:
      PROXY_AUTH_USER: ${LOCAL_PROXY_AUTH_USER:-globevpn_local}
      PROXY_AUTH_PASS: ${LOCAL_PROXY_AUTH_PASS:-globevpn_local_pass}
      PROXY_PORT: 8443
      PROXY_TLS_ENABLED: "false"
    ports:
      - "8443:8443"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://globevpn:globevpn_dev_pass@postgres:5432/globevpn
      REDIS_URL: redis://redis:6379/0
      LOCAL_PROXY_ENABLED: ${LOCAL_PROXY_ENABLED:-true}
      LOCAL_PROXY_HOST: host.docker.internal
      LOCAL_PROXY_PORT: 8443
      LOCAL_PROXY_SCHEME: http
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      local-proxy:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
